name: Sync SukiSU-Ultra

on:
  workflow_dispatch:
  schedule:
    - cron: '12 */4 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
         ref: master
         submodules: recursive
         fetch-depth: 0
         token: ${{ secrets.PAT_TOKEN }}

    - name: Sync KernelSU Repository
      run: |
        git config user.name "GitHub"
        git config user.email "actions@github.com"

        ROOT_DIR=$(pwd)
        SUBMODULE_DIR="$ROOT_DIR/SukiSU-Ultra"

        cd "$SUBMODULE_DIR"
        git fetch origin main

        CURRENT_COMMIT=$(git rev-parse HEAD)
        TARGET_COMMIT=$(git rev-parse FETCH_HEAD)

        if [ "$CURRENT_COMMIT" != "$TARGET_COMMIT" ]; then
          echo "Updates found: $CURRENT_COMMIT -> $TARGET_COMMIT"

          COMMITS=$(git log --reverse --format="%H" ${CURRENT_COMMIT}..${TARGET_COMMIT})

          for COMMIT in $COMMITS; do
            echo "Syncing commit: $COMMIT"

            cd "$SUBMODULE_DIR"
            git checkout $COMMIT

            RAW_MSG=$(git log -1 --pretty=format:"%B" $COMMIT)
            AUTHOR_NAME=$(git log -1 --pretty=format:"%an" $COMMIT)
            AUTHOR_EMAIL=$(git log -1 --pretty=format:"%ae" $COMMIT)
            COMMIT_MSG=$(echo "$RAW_MSG" | sed -E 's/#([0-9]+)/SukiSU-Ultra\/SukiSU-Ultra#\1/g')

            cd "$ROOT_DIR"
            git add SukiSU-Ultra
            GIT_COMMITTER_NAME="$AUTHOR_NAME" GIT_COMMITTER_EMAIL="$AUTHOR_EMAIL" \
            git commit --author="$AUTHOR_NAME <$AUTHOR_EMAIL>" -m "$COMMIT_MSG"
          done

          git push origin master
          echo "Sync completed successfully!"
        else
          echo "Updates not found in SukiSU-Ultra!"
        fi
